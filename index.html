<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="センター計算機" />
  <title>センター計算機</title>
  <!-- アプリアイコン -->
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f7f4ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 20px 90px;
      -webkit-tap-highlight-color: transparent;
    }
    /* タブバー */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: #fff;
      border-top: 1px solid #e8e2d8;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      padding: 8px 0;
      border: none;
      background: none;
      color: #c0b8a8;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      font-size: 10px;
      transition: color 0.2s;
    }
    .tab-item.active { color: #8c7a5e; }
    .tab-item svg { width: 22px; height: 22px; }
    /* ページ */
    .page { display: none; width: 100%; max-width: 440px; }
    .page.active { display: block; }
    h1 { font-size: 24px; font-weight: 700; color: #2c2820; text-align: center; margin-bottom: 28px; }
    .svg-wrap { margin-bottom: 20px; }
    .svg-wrap svg { display: block; width: 100%; }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.07);
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 12px; margin-bottom: 16px; }
    .col { flex: 1; }
    label { display: block; font-size: 12px; color: #7a7060; margin-bottom: 6px; }
    label span { color: #c0b8a8; font-size: 10px; }
    input[type=number] {
      width: 100%;
      padding: 10px 14px;
      font-size: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      border: 1.5px solid #e8e2d8;
      border-radius: 12px;
      outline: none;
      background: #faf8f4;
      color: #2c2820;
    }
    input[type=number]:focus { border-color: #8c7a5e; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .divider { height: 1px; background: #f0ece4; margin-bottom: 20px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .slider-label { font-size: 12px; color: #7a7060; }
    .slider-right { display: flex; align-items: center; gap: 10px; }
    .slider-value { font-size: 20px; color: #2c2820; }
    .slider-value span { font-size: 11px; color: #b0a898; margin-left: 3px; }
    .lock-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1.5px solid #e0d8cc;
      background: #faf8f4;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .lock-btn.locked { border-color: #8c7a5e; background: #8c7a5e; }
    input[type=range] {
      width: 100%;
      accent-color: #8c7a5e;
      cursor: pointer;
    }
    input[type=range]:disabled { opacity: 0.5; cursor: not-allowed; accent-color: #c0b8a8; }
    .tick-wrap { position: relative; margin-top: 4px; height: 28px; margin-left: 0; margin-right: 0; }
    .tick-ends { display: flex; justify-content: space-between; font-size: 10px; color: #c0b8a8; padding: 4px 10px 0; }
    .tick { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    .tick-mark { width: 1.5px; height: 5px; background: #c0b8a8; opacity: 0.7; }
    .tick-mark.active { width: 2px; height: 8px; background: #8c7a5e; opacity: 1; }
    .lock-msg { font-size: 10px; color: #8c7a5e; margin-top: 6px; }
  </style>
</head>
<body>
<!-- 計算機ページ -->
<div class="page active" id="page-calc">
  <div style="width:100%;max-width:440px;">
  <h1>センター計算</h1>

  <div class="svg-wrap">
    <svg id="diagram" viewBox="0 0 380 430"></svg>
  </div>

  <div class="card">
    <div class="row">
      <div class="col">
        <label>高さ(H) <span>mm</span></label>
        <input type="number" id="artH" value="600" inputmode="numeric" oninput="drawDiagram()" />
      </div>
      <div class="col">
        <label>幅(W) <span>mm（任意）</span></label>
        <input type="number" id="artW" value="450" inputmode="numeric" oninput="drawDiagram()" />
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="slider-header">
        <span class="slider-label">センター</span>
        <div class="slider-right">
          <span class="slider-value" style="display:flex;align-items:center;gap:4px;">
            <input type="number" id="eyeVal" value="1450" inputmode="numeric"
              oninput="onEyeValInput(this.value)"
              onblur="onEyeValBlur()"
              onfocus="this.style.borderColor='#8c7a5e'; this.style.background='#faf8f4';"
              style="width:64px;border:1.5px solid #e8e2d8;border-radius:8px;background:#f7f4ef;font-size:18px;color:#2c2820;font-family:-apple-system,Hiragino Sans,sans-serif;text-align:right;padding:4px 6px;outline:none;transition:all 0.2s;" />
            <span>mm</span>
          </span>
          <button class="lock-btn" id="lockBtn" onclick="toggleLock()">
            <svg id="lockIcon" width="14" height="16" viewBox="0 0 14 16" fill="none"></svg>
          </button>
        </div>
      </div>
      <input type="range" id="slider" min="1250" max="1650" value="1450" oninput="onSlider(this.value)" />
      <div class="tick-wrap">
        <div id="ticks"></div>
      </div>
      <div class="lock-msg" id="lockMsg" style="display:none">🔒 ロック中 — タップして解除</div>
    </div>
  </div>
  </div>
</div>

<!-- ドッコページ -->
<div class="page" id="page-dokko">
  <div style="width:100%;max-width:440px;">
    <h1>ドッコ計算</h1>

    <!-- 作品図 -->
    <div style="margin-bottom:16px;">
      <svg id="dokko-diagram" width="100%" viewBox="0 0 380 320" style="display:block;"></svg>
    </div>

    <!-- 入力 -->
    <div class="card">
      <!-- 結果 -->
      <div id="dk-result" style="margin-bottom:20px;padding:12px 20px;background:#2c2820;border-radius:16px;text-align:center;">
        <div style="font-size:11px;color:#8c7a5e;letter-spacing:0.15em;margin-bottom:4px;">ドッコ位置（床から）</div>
        <div id="dk-result-val" style="font-size:32px;font-weight:300;color:#f7f4ef;line-height:1;">—</div>
        <div style="font-size:12px;color:#8c7a5e;margin-top:2px;">mm</div>
      </div>

      <label style="display:block;font-size:12px;color:#7a7060;margin-bottom:6px;">
        作品上部からドッコまでの距離 <span style="color:#c0b8a8;font-size:10px;">mm</span>
      </label>
      <input type="number" id="dk-offset" inputmode="numeric" placeholder="例：50"
        oninput="calcDokko()"
        onfocus="this.style.borderColor='#8c7a5e'"
        onblur="this.style.borderColor='#e8e2d8'"
      />
    </div>

  </div>
</div>

<!-- 間隔ページ -->
<div class="page" id="page-spacing">
  <div style="width:100%;max-width:440px;">
    <h1>作品間隔</h1>

    <!-- 図（常時表示） -->
    <div style="margin-bottom:16px;">
      <svg id="spacing-diagram" width="100%" viewBox="0 0 380 160" style="display:block;"></svg>
    </div>

    <!-- 入力 -->
    <div class="card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
        <button id="sp-copy-btn" onclick="copySpToSpacing2(this)" style="
          display:flex;align-items:center;gap:4px;
          background:#faf8f4;border:1px solid #e0d8cc;border-radius:8px;
          cursor:pointer;padding:5px 10px;font-size:10px;color:#8c7a5e;
          font-family:-apple-system,Hiragino Sans,sans-serif;
          transition:all 0.15s;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="5" y="5" width="9" height="9" rx="1.5"/>
            <path d="M3 10V3a1 1 0 011-1h7" />
          </svg>
          複数間隔へコピー
        </button>
      </div>
      <div class="row">
        <div class="col">
          <label>作品の幅 <span>mm</span></label>
          <input type="number" id="sp-art-w" inputmode="numeric" value="450"
            oninput="calcSpacing()"
            onfocus="this.style.borderColor='#8c7a5e'"
            onblur="this.style.borderColor='#e8e2d8'" />
        </div>
        <div class="col">
          <label>作品の高さ <span style="color:#c0b8a8;font-size:10px;">mm（任意）</span></label>
          <input type="number" id="sp-art-h" inputmode="numeric" value="600"
            oninput="calcSpacing()"
            onfocus="this.style.borderColor='#8c7a5e'"
            onblur="this.style.borderColor='#e8e2d8'" />
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>壁の幅 <span>mm</span></label>
          <input type="number" id="sp-wall" inputmode="numeric" value="3000"
            oninput="calcSpacing()"
            onfocus="this.style.borderColor='#8c7a5e'"
            onblur="this.style.borderColor='#e8e2d8'" />
        </div>
        <div class="col"></div>
      </div>
    </div>

  </div>
</div>

<!-- 間隔2ページ -->
<div class="page" id="page-spacing2">
  <div style="width:100%;max-width:440px;">
    <h1>複数の作品間隔</h1>

    <!-- 図（常時表示） -->
    <div style="margin-bottom:16px;">
      <svg id="sp2-diagram" width="100%" viewBox="0 0 380 160" style="display:block;"></svg>
    </div>

    <!-- 入力：基本 -->
    <div class="card" style="margin-bottom:12px;">
      <div class="row">
        <div class="col">
          <label>壁の幅 <span>mm</span></label>
          <input type="number" id="sp2-wall" inputmode="numeric" value="3000"
            oninput="calcSpacing2()"
            onfocus="this.style.borderColor='#8c7a5e'"
            onblur="this.style.borderColor='#e8e2d8'" />
        </div>
        <div class="col">
          <label>作品数</label>
          <input type="number" id="sp2-count" inputmode="numeric" value="3" min="1" max="10"
            oninput="updateSp2Inputs()"
            onfocus="this.style.borderColor='#8c7a5e'"
            onblur="this.style.borderColor='#e8e2d8'" />
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>壁の余白(左) <span>mm</span></label>
          <input type="number" id="sp2-margin-l" inputmode="numeric" value="300"
            oninput="onMarginChange('l')"
            onfocus="this.style.borderColor='#8c7a5e'"
            onblur="this.style.borderColor='#e8e2d8'" />
        </div>
        <div class="col">
          <label>壁の余白(右) <span>mm</span></label>
          <input type="number" id="sp2-margin-r" inputmode="numeric" value="300"
            oninput="onMarginChange('r')"
            onfocus="this.style.borderColor='#8c7a5e'"
            onblur="this.style.borderColor='#e8e2d8'" />
        </div>
      </div>
      <div style="display:flex;justify-content:center;gap:8px;margin-top:8px;">
        <button id="sp2-margin-lock" onclick="toggleMarginLock()" style="
          display:flex;align-items:center;gap:6px;
          background:#faf8f4;border:1.5px solid #e0d8cc;border-radius:10px;
          cursor:pointer;padding:6px 14px;
          font-size:11px;color:#8c7a5e;font-family:-apple-system,Hiragino Sans,sans-serif;
          transition:all 0.2s;
        ">
          <svg id="sp2-margin-lock-icon" width="13" height="15" viewBox="0 0 14 16" fill="none"></svg>
          <span id="sp2-margin-lock-label">左右連動</span>
        </button>
        <button id="sp2-sync-btn" onclick="syncMarginToGap()" style="
          display:flex;align-items:center;gap:6px;
          background:#8c7a5e;border:1.5px solid #8c7a5e;border-radius:10px;
          cursor:pointer;padding:6px 14px;
          font-size:11px;color:#f7f4ef;font-family:-apple-system,Hiragino Sans,sans-serif;
          transition:all 0.2s;
        ">
          <span>均等な間隔へ</span>
        </button>
      </div>
    </div>

    <!-- 作品ごとの入力（動的生成） -->
    <div id="sp2-art-inputs"></div>

  </div>
</div>

<!-- タブバー -->
<nav class="tab-bar">
  <button class="tab-item active" onclick="switchTab('calc')" id="tab-calc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="7" y="6" width="10" height="12" rx="1"/>
      <line x1="1" y1="12" x2="23" y2="12" stroke-dasharray="2.5,2.5"/>
    </svg>
    センター
  </button>
  <button class="tab-item" onclick="switchTab('dokko')" id="tab-dokko">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <!-- 木の板 -->
      <rect x="2" y="9" width="20" height="6" rx="1.5"/>
      <!-- ビス2点（ドット） -->
      <circle cx="8" cy="12" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    ドッコ
  </button>
  <button class="tab-item" onclick="switchTab('spacing')" id="tab-spacing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="8" y="6" width="8" height="12" rx="1"/>
      <line x1="2" y1="12" x2="8" y2="12"/>
      <line x1="16" y1="12" x2="22" y2="12"/>
    </svg>
    間隔
  </button>
  <button class="tab-item" onclick="switchTab('spacing2')" id="tab-spacing2">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="1" y="6" width="5" height="12" rx="1"/>
      <rect x="9.5" y="6" width="5" height="12" rx="1"/>
      <rect x="18" y="6" width="5" height="12" rx="1"/>
      <line x1="6" y1="12" x2="9.5" y2="12"/>
      <line x1="14.5" y1="12" x2="18" y2="12"/>
    </svg>
    複数間隔
  </button>
</nav>

<script>
  const TAB_ORDER = ['calc', 'dokko', 'spacing', 'spacing2'];

  function switchTab(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'calc') { setTimeout(() => { drawTicks(); drawDiagram(); }, 50); }
    if (name === 'dokko') { syncDokko(); }
    if (name === 'spacing') {
      syncCenterToSpacing();
      setTimeout(() => { calcSpacing(); }, 50);
    }
    if (name === 'spacing2') { setTimeout(() => { updateSp2Inputs(); }, 50); }
  }

  function syncCenterToSpacing() {
    const centerW = document.getElementById('artW');
    const centerH = document.getElementById('artH');
    const spW = document.getElementById('sp-art-w');
    const spH = document.getElementById('sp-art-h');
    if (centerW && spW) spW.value = centerW.value;
    if (centerH && spH) spH.value = centerH.value;
  }

  function getCurrentTab() {
    const active = document.querySelector('.tab-item.active');
    return active ? active.id.replace('tab-', '') : 'calc';
  }

  // 横スワイプでタブ切り替え
  let touchStartX = 0, touchStartY = 0, touchTracking = false;

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const tag = e.target.tagName;
    // スライダーや入力欄の操作はスワイプ判定から除外
    if (tag === 'INPUT' || e.target.type === 'range') {
      touchTracking = false;
      return;
    }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchTracking = true;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!touchTracking) return;
    touchTracking = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    // 横方向の移動が十分大きく、縦方向より明確に大きい場合のみスワイプとみなす
    const SWIPE_THRESHOLD = 60;
    if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.5) return;

    const current = getCurrentTab();
    const idx = TAB_ORDER.indexOf(current);
    if (idx === -1) return;

    if (dx < 0 && idx < TAB_ORDER.length - 1) {
      // 左スワイプ → 次のタブ
      switchTab(TAB_ORDER[idx + 1]);
    } else if (dx > 0 && idx > 0) {
      // 右スワイプ → 前のタブ
      switchTab(TAB_ORDER[idx - 1]);
    }
  }, { passive: true });

  function syncDokko() {
    if (dokkoOffset !== null) {
      document.getElementById('dk-offset').value = dokkoOffset;
    }
    calcDokko();
  }

  let dokkoOffset = null;

  function calcDokko() {
    const h = parseFloat(document.getElementById('artH').value) || 600;
    const top = eyeLevel + h / 2;
    const offset = parseFloat(document.getElementById('dk-offset').value);
    // 入力値を記憶
    dokkoOffset = isNaN(offset) ? null : offset;
    if (dokkoOffset === null) {
      document.getElementById('dk-result-val').textContent = '—';
      drawDokkodiagram(null);
      return;
    }
    const dokkoPos = top - dokkoOffset;
    document.getElementById('dk-result-val').textContent = Math.round(dokkoPos);
    drawDokkodiagram(dokkoPos);
  }

  function drawDokkodiagram(dokkoPos) {
    const W = 380, H = 300;
    const h = parseFloat(document.getElementById('artH').value) || 600;
    const w = parseFloat(document.getElementById('artW').value) || h * 0.75;

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('dokko-diagram');
    svg.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    function el(tag, attrs) {
      const e = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      return e;
    }
    function txt(content, attrs) {
      const e = document.createElementNS(ns, 'text');
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      e.textContent = content;
      return e;
    }

    // 縦横比を維持してSVGいっぱいに表示（寸法線のスペース確保）
    const margin = 16;
    const marginTop = 28;    // 作品上部ラベル用
    const marginBottom = 30; // 幅の寸法線用
    const marginRight = 40;  // 高さの寸法線用
    const marginLeft = 55;   // センターラベル用
    const ratio = w / h;
    let frameW, frameH;
    if (ratio >= (W - marginLeft - marginRight) / (H - marginTop - marginBottom)) {
      frameW = W - marginLeft - marginRight;
      frameH = frameW / ratio;
    } else {
      frameH = H - marginTop - marginBottom;
      frameW = frameH * ratio;
    }
    const frameX = marginLeft + (W - marginLeft - marginRight - frameW) / 2;
    const frameY = marginTop + (H - marginTop - marginBottom - frameH) / 2;

    // 背景
    svg.appendChild(el('rect', {x:0,y:0,width:W,height:H,fill:'#f7f4ef'}));

    // 額縁
    svg.appendChild(el('rect', {x:frameX+2,y:frameY+2,width:frameW,height:frameH,fill:'rgba(0,0,0,0.06)'}));
    svg.appendChild(el('rect', {x:frameX,y:frameY,width:frameW,height:frameH,fill:'#c8b89a',stroke:'#8c7a5e','stroke-width':3}));
    svg.appendChild(el('rect', {x:frameX+8,y:frameY+8,width:frameW-16,height:frameH-16,fill:'#a08060'}));

    // 作品上部（右上に表示）
    const top = eyeLevel + h / 2;
    svg.appendChild(txt(`作品上部  ${Math.round(top)}`, {
      x: W - 8, y: 18,
      'font-size': 11, fill: '#5a4a30',
      'font-family': '-apple-system,Hiragino Sans,sans-serif',
      'font-weight': 'bold', 'text-anchor': 'end'
    }));

    // 作品高さ（右横）
    svg.appendChild(el('line', {x1:frameX+frameW+6,y1:frameY,x2:frameX+frameW+6,y2:frameY+frameH,stroke:'#a89070','stroke-width':1,opacity:0.5}));
    svg.appendChild(el('line', {x1:frameX+frameW+2,y1:frameY,x2:frameX+frameW+10,y2:frameY,stroke:'#a89070','stroke-width':1,opacity:0.5}));
    svg.appendChild(el('line', {x1:frameX+frameW+2,y1:frameY+frameH,x2:frameX+frameW+10,y2:frameY+frameH,stroke:'#a89070','stroke-width':1,opacity:0.5}));
    svg.appendChild(txt(Math.round(h), {x:frameX+frameW+14,y:(frameY+frameY+frameH)/2+4,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif'}));

    svg.appendChild(el('line', {x1:frameX,y1:frameY+frameH+8,x2:frameX+frameW,y2:frameY+frameH+8,stroke:'#a89070','stroke-width':1,opacity:0.5}));

    svg.appendChild(txt(Math.round(w), {x:frameX+frameW/2,y:frameY+frameH+22,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));

    // センターY（額縁内の中央）
    const eyeYinFrame = frameY + frameH / 2;

    // センターライン（額縁の左外から額縁左端まで）
    svg.appendChild(el('line', {x1:0,y1:eyeYinFrame,x2:frameX,y2:eyeYinFrame,stroke:'#c0392b','stroke-width':1.5,'stroke-dasharray':'6,4',opacity:0.7}));
    svg.appendChild(txt(eyeLevel, {x:4,y:eyeYinFrame-4,'font-size':11,fill:'#c0392b','font-family':'-apple-system,Hiragino Sans,sans-serif','font-weight':'bold',opacity:0.9}));

    // ドッコ
    if (dokkoPos !== null) {

  const WALL_W = 380;
  const DRAW_H = 400;
  const MARGIN_RIGHT = 90;
  const REAL_RANGE = 2400;
  const BG = "#f7f4ef";
  const SNAP_POINTS = [1250,1300,1350,1400,1450,1500,1550,1600,1650];
  const SNAP_RANGE = 8;

  let eyeLevel = 1450;
  let locked = false;

  function toY(mm) { return DRAW_H - (mm / REAL_RANGE) * DRAW_H; }

  function drawTicks() {
    const wrap = document.getElementById('ticks');
    const slider = document.getElementById('slider');
    const min = 1250, max = 1650;
    wrap.innerHTML = '';

    // スライダーの実際の幅からつまみ分を引いてトラック幅を計算
    const sliderRect = slider.getBoundingClientRect();
    const thumbSize = 20; // iOSのつまみ幅
    const trackWidth = sliderRect.width - thumbSize;
    const trackStart = thumbSize / 2;

    SNAP_POINTS.forEach(p => {
      const pct = (p - min) / (max - min);
      const leftPx = trackStart + pct * trackWidth;
      const d = document.createElement('div');
      d.className = 'tick';
      d.style.left = leftPx + 'px';
      const isActive = eyeLevel === p;
      const mark = document.createElement('div');
      mark.className = 'tick-mark' + (isActive ? ' active' : '');
      d.appendChild(mark);
      // 両端と1450にラベルを追加
      if (p === 1250 || p === 1650 || p === 1450) {
        const label = document.createElement('span');
        label.style.fontSize = '10px';
        label.style.color = '#c0b8a8';
        label.style.marginTop = '3px';
        label.textContent = p;
        d.appendChild(label);
      }
      wrap.appendChild(d);
    });
  }

  function drawLockIcon() {
    const svg = document.getElementById('lockIcon');
    if (locked) {
      svg.innerHTML = `
        <rect x="1" y="7" width="12" height="8" rx="2" fill="#f7f4ef"/>
        <path d="M4 7V5a3 3 0 016 0v2" stroke="#f7f4ef" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="7" cy="11" r="1.2" fill="#8c7a5e"/>`;
    } else {
      svg.innerHTML = `
        <rect x="1" y="7" width="12" height="8" rx="2" fill="#c0b8a8"/>
        <path d="M4 7V5a3 3 0 016 0" stroke="#c0b8a8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="7" cy="11" r="1.2" fill="#f7f4ef"/>`;
    }
  }

  function toggleLock() {
    locked = !locked;
    const btn = document.getElementById('lockBtn');
    const slider = document.getElementById('slider');
    const eyeInput = document.getElementById('eyeVal');
    const msg = document.getElementById('lockMsg');
    btn.classList.toggle('locked', locked);
    slider.disabled = locked;
    eyeInput.disabled = locked;
    msg.style.display = locked ? 'block' : 'none';
    drawLockIcon();
  }

  function onSlider(val) {
    if (locked) return;
    val = parseInt(val);
    const snapped = SNAP_POINTS.find(p => Math.abs(val - p) <= SNAP_RANGE);
    eyeLevel = snapped !== undefined ? snapped : val;
    document.getElementById('slider').value = eyeLevel;
    document.getElementById('eyeVal').value = eyeLevel;
    drawTicks();
    drawDiagram();
  }

  function onEyeValInput(val) {
    if (locked) return;
    val = parseInt(val);
    if (isNaN(val)) return;
    eyeLevel = val;
    document.getElementById('slider').value = eyeLevel;
    drawTicks();
    drawDiagram();
  }

  function onEyeValBlur() {
    const input = document.getElementById('eyeVal');
    input.style.borderColor = '#e8e2d8';
    input.style.background = '#f7f4ef';
    let val = parseInt(input.value);
    if (isNaN(val)) val = eyeLevel;
    eyeLevel = val;
    input.value = eyeLevel;
    // スライダーの表示上の範囲内であればスライダー位置も更新、範囲外なら端で固定表示
    const sliderMin = 1250, sliderMax = 1650;
    document.getElementById('slider').value = Math.min(Math.max(val, sliderMin), sliderMax);
    drawTicks();
    drawDiagram();
  }

  function drawDiagram() {
    const h = parseFloat(document.getElementById('artH').value) || 600;
    const w = parseFloat(document.getElementById('artW').value) || 450;

    const topHeight = eyeLevel + h / 2;
    const bottomHeight = eyeLevel - h / 2;

    // REAL_RANGEは作品サイズと実際のセンター位置(eyeLevel)を考慮して決定
    const maxTop = Math.max(1650, eyeLevel) + h / 2;
    const REAL_RANGE = Math.max(2400, maxTop * 1.1);
    const toYd = (mm) => DRAW_H - (mm / REAL_RANGE) * DRAW_H;

    const maxWidth = WALL_W - MARGIN_RIGHT - 60;

    // 高さ・幅どちらも同じスケールで計算（縦横比を完全に維持）
    const scaleH = DRAW_H / REAL_RANGE;
    const scaleW = maxWidth / Math.max(w, 1);
    const artScale = Math.min(scaleH, scaleW);

    const artHeightPx = h * artScale;
    const artWidthPx = w * artScale;
    const artLeft = (WALL_W - artWidthPx) / 2;

    // 表示位置：床(toYd(0)=DRAW_H)を基準に作品下部から配置
    const artBotY = toYd(bottomHeight < 0 ? 0 : bottomHeight);
    const artTopY = artBotY - artHeightPx;
    const eyeY = artTopY + artHeightPx / 2;

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('diagram');
    svg.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${WALL_W} ${DRAW_H + 30}`);

    function el(tag, attrs) {
      const e = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      return e;
    }
    function txt(content, attrs) {
      const e = document.createElementNS(ns, 'text');
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      e.textContent = content;
      return e;
    }

    // 壁
    svg.appendChild(el('rect', {x:0,y:0,width:WALL_W,height:DRAW_H,fill:BG}));

    // 床（線のみ）
    svg.appendChild(el('line', {x1:0,y1:DRAW_H,x2:WALL_W,y2:DRAW_H,stroke:'#8c7a5e','stroke-width':3}));

    // 額縁
    if (artHeightPx > 4 && artWidthPx > 4) {
      svg.appendChild(el('rect', {x:artLeft+2,y:artTopY+2,width:artWidthPx,height:artHeightPx,fill:'rgba(0,0,0,0.06)'}));
      svg.appendChild(el('rect', {x:artLeft,y:artTopY,width:artWidthPx,height:artHeightPx,fill:'#c8b89a',stroke:'#8c7a5e','stroke-width':2.5}));
      svg.appendChild(el('rect', {x:artLeft+6,y:artTopY+6,width:artWidthPx-12,height:artHeightPx-12,fill:BG}));
    }

    // 目線ライン
    svg.appendChild(el('line', {x1:0,y1:eyeY,x2:artLeft,y2:eyeY,stroke:'#c0392b','stroke-width':1.5,'stroke-dasharray':'6,4',opacity:0.7}));
    svg.appendChild(txt(eyeLevel, {x:4,y:eyeY-4,'font-size':11,fill:'#c0392b','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'start','font-weight':'bold',opacity:0.9}));

    // 作品幅（下）
    if (artWidthPx > 20) {
      svg.appendChild(el('line', {x1:artLeft,y1:artBotY+8,x2:artLeft+artWidthPx,y2:artBotY+8,stroke:'#a89070','stroke-width':1,opacity:0.5}));
      svg.appendChild(el('line', {x1:artLeft,y1:artBotY+4,x2:artLeft,y2:artBotY+12,stroke:'#a89070','stroke-width':1,opacity:0.5}));
      svg.appendChild(el('line', {x1:artLeft+artWidthPx,y1:artBotY+4,x2:artLeft+artWidthPx,y2:artBotY+12,stroke:'#a89070','stroke-width':1,opacity:0.5}));
      svg.appendChild(txt(Math.round(w), {x:artLeft+artWidthPx/2,y:artBotY+22,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
    }

    // 右側寸法線
    if (artTopY < DRAW_H - 4) {
      svg.appendChild(el('line', {x1:WALL_W-16,y1:artTopY,x2:WALL_W-16,y2:DRAW_H,stroke:'#8c7a5e','stroke-width':1.2,opacity:0.6}));
      svg.appendChild(el('line', {x1:WALL_W-23,y1:artTopY,x2:WALL_W-9,y2:artTopY,stroke:'#8c7a5e','stroke-width':1.2,opacity:0.6}));
      svg.appendChild(el('line', {x1:WALL_W-23,y1:DRAW_H,x2:WALL_W-9,y2:DRAW_H,stroke:'#8c7a5e','stroke-width':1.2,opacity:0.6}));
      svg.appendChild(txt('作品上部', {x:WALL_W-42,y:artTopY-10,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
      svg.appendChild(txt(Math.round(topHeight), {x:WALL_W-42,y:artTopY+3,'font-size':11,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','font-weight':'bold','text-anchor':'middle'}));
      svg.appendChild(el('line', {x1:WALL_W-23,y1:artBotY,x2:WALL_W-9,y2:artBotY,stroke:'#8c7a5e','stroke-width':1.2,opacity:0.6}));
      svg.appendChild(txt('作品下部', {x:WALL_W-42,y:artBotY+14,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
      svg.appendChild(txt(Math.round(bottomHeight), {x:WALL_W-42,y:artBotY+27,'font-size':11,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','font-weight':'bold','text-anchor':'middle'}));
    }

    // 作品高さ（右横）
    if (artHeightPx > 20) {
      svg.appendChild(el('line', {x1:artLeft+artWidthPx+6,y1:artTopY,x2:artLeft+artWidthPx+6,y2:artBotY,stroke:'#a89070','stroke-width':1,opacity:0.5}));
      svg.appendChild(el('line', {x1:artLeft+artWidthPx+2,y1:artTopY,x2:artLeft+artWidthPx+10,y2:artTopY,stroke:'#a89070','stroke-width':1,opacity:0.5}));
      svg.appendChild(el('line', {x1:artLeft+artWidthPx+2,y1:artBotY,x2:artLeft+artWidthPx+10,y2:artBotY,stroke:'#a89070','stroke-width':1,opacity:0.5}));
      svg.appendChild(txt(Math.round(h), {x:artLeft+artWidthPx+14,y:(artTopY+artBotY)/2+4,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif'}));
    }
  }

  function calcSpacing() {
    const wall = parseFloat(document.getElementById('sp-wall').value);
    const artW = parseFloat(document.getElementById('sp-art-w').value);
    const artHInput = parseFloat(document.getElementById('sp-art-h').value);
    const artH = isNaN(artHInput) ? null : artHInput;

    if (!wall || !artW) {
      drawSpacingDiagram(null);
      return;
    }

    const margin = (wall - artW) / 2;
    drawSpacingDiagram({ wall, artW, artH, margin });
  }

  function drawSpacingDiagram(data) {
    const W = 380, H = 150;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('spacing-diagram');
    if (!svg) return;
    svg.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    function el(tag, attrs) {
      const e = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      return e;
    }
    function txt(content, attrs) {
      const e = document.createElementNS(ns, 'text');
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      e.textContent = content;
      return e;
    }

    svg.appendChild(el('rect', {x:0,y:0,width:W,height:H,fill:'#f7f4ef'}));
    if (!data) return;

    const { wall, artW, artH, margin } = data;

    if (margin < 0) {
      svg.appendChild(txt('作品が壁に収まりません', {x:W/2,y:H/2,'font-size':12,fill:'#c0392b','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
      return;
    }

    // 壁・作品・余白すべてを同じスケールで計算
    const drawW = W - 40;
    const offsetX = 20;
    const ratio = artH ? artH / artW : 0.8;
    const topMargin = 30; // 寸法ラベル用スペース
    const maxH = H - topMargin - 10;

    // 壁の幅を基準にスケールを決定（余白・作品は必ず比例）
    const scaleByW = drawW / wall;
    const artHpxNatural = artW * scaleByW * ratio;
    // 高さがSVGをはみ出す場合だけ縮小
    const heightLimit = artHpxNatural > maxH ? maxH / artHpxNatural : 1;
    const drawScale = scaleByW * heightLimit;

    const finalFrameW = artW * drawScale;
    const finalFrameH = finalFrameW * ratio;
    const marginPx = margin * drawScale;
    // 作品を常にSVG中央に配置
    const artX = (W - finalFrameW) / 2;
    const artX2 = artX + finalFrameW;
    // 壁の端はスケールに基づいて作品位置から逆算
    const wallLeftX = artX - marginPx;
    const wallRightX = artX2 + marginPx;
    // frameYはtopMargin以下に収める
    const frameY = topMargin + (maxH - finalFrameH) / 2;
    const arrowY = frameY + finalFrameH / 2;

    // 壁の端
    svg.appendChild(el('line', {x1:wallLeftX,y1:frameY-6,x2:wallLeftX,y2:frameY+finalFrameH+6,stroke:'#8c7a5e','stroke-width':2.5}));
    svg.appendChild(el('line', {x1:wallRightX,y1:frameY-6,x2:wallRightX,y2:frameY+finalFrameH+6,stroke:'#8c7a5e','stroke-width':2.5}));

    // 作品
    svg.appendChild(el('rect', {x:artX+1,y:frameY+1,width:finalFrameW,height:finalFrameH,fill:'rgba(0,0,0,0.05)'}));
    svg.appendChild(el('rect', {x:artX,y:frameY,width:finalFrameW,height:finalFrameH,fill:'#c8b89a',stroke:'#8c7a5e','stroke-width':1.5}));
    if (finalFrameW > 12 && finalFrameH > 12) {
      svg.appendChild(el('rect', {x:artX+5,y:frameY+5,width:finalFrameW-10,height:finalFrameH-10,fill:'#f7f4ef'}));
    }

    // 作品幅の寸法線（作品の上）
    const dimLineY = frameY - 8;
    svg.appendChild(el('line', {x1:artX,y1:dimLineY,x2:artX2,y2:dimLineY,stroke:'#a89070','stroke-width':1,opacity:0.7}));
    svg.appendChild(el('line', {x1:artX,y1:dimLineY-3,x2:artX,y2:dimLineY+3,stroke:'#a89070','stroke-width':1,opacity:0.7}));
    svg.appendChild(el('line', {x1:artX2,y1:dimLineY-3,x2:artX2,y2:dimLineY+3,stroke:'#a89070','stroke-width':1,opacity:0.7}));
    svg.appendChild(txt(`(${Math.round(artW/2)})`, {x:(artX+artX2)/2,y:dimLineY-14,'font-size':8,fill:'#b0a898','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
    svg.appendChild(txt(Math.round(artW), {x:(artX+artX2)/2,y:dimLineY-4,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));

    // 左矢印
    svg.appendChild(el('line', {x1:wallLeftX,y1:arrowY,x2:artX,y2:arrowY,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:wallLeftX,y1:arrowY-4,x2:wallLeftX,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:artX,y1:arrowY-4,x2:artX,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(txt(Math.round(margin), {x:(wallLeftX+artX)/2,y:arrowY-6,'font-size':10,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));

    // 右矢印
    svg.appendChild(el('line', {x1:artX2,y1:arrowY,x2:wallRightX,y2:arrowY,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:artX2,y1:arrowY-4,x2:artX2,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:wallRightX,y1:arrowY-4,x2:wallRightX,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(txt(Math.round(margin), {x:(artX2+wallRightX)/2,y:arrowY-6,'font-size':10,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
  }

  let sp2MarginLocked = true;

  function syncMarginToGap() {
    const wall = parseFloat(document.getElementById('sp2-wall').value);
    const count = parseInt(document.getElementById('sp2-count').value) || 0;

    const arts = [];
    for (let i = 0; i < count; i++) {
      const wEl = document.getElementById(`sp2-art-w-${i}`);
      if (!wEl) break;
      arts.push({ w: parseFloat(wEl.value) || 0 });
    }
    if (!wall || arts.length === 0) return;

    const totalArtW = arts.reduce((s, a) => s + a.w, 0);
    const numGaps = arts.length + 1;
    const evenGap = (wall - totalArtW) / numGaps;
    if (evenGap < 0) return;

    document.getElementById('sp2-margin-l').value = Math.round(evenGap);
    document.getElementById('sp2-margin-r').value = Math.round(evenGap);
    calcSpacing2(true);
    setSyncBtnState(true);
  }

  function setSyncBtnState(synced) {
    const btn = document.getElementById('sp2-sync-btn');
    if (!btn) return;
    if (synced) {
      btn.style.background = '#e8e2d8';
      btn.style.borderColor = '#e8e2d8';
      btn.style.color = '#b0a898';
    } else {
      btn.style.background = '#8c7a5e';
      btn.style.borderColor = '#8c7a5e';
      btn.style.color = '#f7f4ef';
    }
  }

  function toggleMarginLock() {
    sp2MarginLocked = !sp2MarginLocked;
    const icon = document.getElementById('sp2-margin-lock-icon');
    const label = document.getElementById('sp2-margin-lock-label');
    const btn = document.getElementById('sp2-margin-lock');
    label.textContent = sp2MarginLocked ? '左右連動' : '個別設定';
    if (sp2MarginLocked) {
      btn.style.background = '#8c7a5e';
      btn.style.borderColor = '#8c7a5e';
      btn.style.color = '#f7f4ef';
      icon.innerHTML = `
        <rect x="1" y="7" width="12" height="8" rx="2" fill="#f7f4ef"/>
        <path d="M4 7V5a3 3 0 016 0v2" stroke="#f7f4ef" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="7" cy="11" r="1.2" fill="#8c7a5e"/>`;
      // ロックしたら左の値に右を合わせる
      const l = document.getElementById('sp2-margin-l').value;
      document.getElementById('sp2-margin-r').value = l;
      calcSpacing2();
    } else {
      btn.style.background = '#faf8f4';
      btn.style.borderColor = '#e0d8cc';
      btn.style.color = '#8c7a5e';
      icon.innerHTML = `
        <rect x="1" y="7" width="12" height="8" rx="2" fill="#c0b8a8"/>
        <path d="M4 7V5a3 3 0 016 0" stroke="#c0b8a8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="7" cy="11" r="1.2" fill="#f7f4ef"/>`;
    }
  }

  function onMarginChange(side) {
    if (sp2MarginLocked) {
      const val = document.getElementById(`sp2-margin-${side}`).value;
      const otherSide = side === 'l' ? 'r' : 'l';
      document.getElementById(`sp2-margin-${otherSide}`).value = val;
    }
    calcSpacing2();
  }

  let sp2Clipboard = null;

  function copySpToSpacing2(btn) {
    const wEl = document.getElementById('sp-art-w');
    const hEl = document.getElementById('sp-art-h');
    if (!wEl) return;
    sp2Clipboard = { w: wEl.value, h: hEl.value };
    flashBtn(btn, '#8c7a5e');
  }

  function flashBtn(btn, color) {
    if (!btn) return;
    const origBg = btn.style.background;
    const origBorder = btn.style.borderColor;
    const origColor = btn.style.color;
    btn.style.background = color;
    btn.style.borderColor = color;
    btn.style.color = '#ffffff';
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => {
      btn.style.background = origBg;
      btn.style.borderColor = origBorder;
      btn.style.color = origColor;
      btn.style.transform = 'scale(1)';
    }, 220);
  }

  function copySp2Art(i, btn) {
    const wEl = document.getElementById(`sp2-art-w-${i}`);
    const hEl = document.getElementById(`sp2-art-h-${i}`);
    if (!wEl) return;
    sp2Clipboard = { w: wEl.value, h: hEl.value };
    flashBtn(btn, '#8c7a5e');
  }

  function pasteSp2Art(i, btn) {
    if (!sp2Clipboard) return;
    const wEl = document.getElementById(`sp2-art-w-${i}`);
    const hEl = document.getElementById(`sp2-art-h-${i}`);
    if (!wEl) return;
    wEl.value = sp2Clipboard.w;
    hEl.value = sp2Clipboard.h;
    calcSpacing2();
    flashBtn(btn, '#2c6e49');
  }

  let sp2LastCount = 0;

  function updateSp2Inputs() {
    const count = parseInt(document.getElementById('sp2-count').value) || 0;
    const container = document.getElementById('sp2-art-inputs');

    // 作品数が変わっていない場合は既存の入力値を保持したまま何もしない
    if (count === sp2LastCount && container.children.length === count) {
      calcSpacing2();
      return;
    }

    // 既存の値を退避
    const prevValues = [];
    for (let i = 0; i < sp2LastCount; i++) {
      const wEl = document.getElementById(`sp2-art-w-${i}`);
      const hEl = document.getElementById(`sp2-art-h-${i}`);
      prevValues.push({
        w: wEl ? wEl.value : null,
        h: hEl ? hEl.value : null,
      });
    }

    container.innerHTML = '';
    const iStyle = 'width:100%;padding:10px 14px;font-size:18px;font-family:-apple-system,Hiragino Sans,sans-serif;border:1.5px solid #e8e2d8;border-radius:12px;outline:none;background:#faf8f4;color:#2c2820;box-sizing:border-box;';
    for (let i = 0; i < count; i++) {
      const prev = prevValues[i];
      const wVal = prev && prev.w !== null ? prev.w : '450';
      const hVal = prev && prev.h !== null ? prev.h : '600';
      const div = document.createElement('div');
      div.className = 'card';
      div.style.marginBottom = '12px';
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="font-size:12px;color:#8c7a5e;font-weight:500;">作品 ${i + 1}</div>
          <div style="display:flex;gap:6px;">
            <button onclick="copySp2Art(${i}, this)" style="
              display:flex;align-items:center;gap:3px;
              background:#faf8f4;border:1px solid #e0d8cc;border-radius:7px;
              cursor:pointer;padding:4px 8px;font-size:10px;color:#8c7a5e;
              font-family:-apple-system,Hiragino Sans,sans-serif;
              transition:all 0.15s;">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <rect x="5" y="5" width="9" height="9" rx="1.5"/>
                <path d="M3 10V3a1 1 0 011-1h7" />
              </svg>
              コピー
            </button>
            <button onclick="pasteSp2Art(${i}, this)" style="
              display:flex;align-items:center;gap:3px;
              background:#faf8f4;border:1px solid #e0d8cc;border-radius:7px;
              cursor:pointer;padding:4px 8px;font-size:10px;color:#8c7a5e;
              font-family:-apple-system,Hiragino Sans,sans-serif;
              transition:all 0.15s;">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <rect x="4" y="3" width="8" height="11" rx="1.5"/>
                <path d="M6 3V2a1 1 0 011-1h2a1 1 0 011 1v1" />
              </svg>
              貼付
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label>幅 <span>mm</span></label>
            <input type="number" id="sp2-art-w-${i}" inputmode="numeric" value="${wVal}"
              oninput="calcSpacing2()" style="${iStyle}" />
          </div>
          <div class="col">
            <label>高さ <span style="color:#c0b8a8;font-size:10px;">mm（任意）</span></label>
            <input type="number" id="sp2-art-h-${i}" inputmode="numeric" value="${hVal}"
              oninput="calcSpacing2()" style="${iStyle}" />
          </div>
        </div>`;
      container.appendChild(div);
    }
    sp2LastCount = count;
    calcSpacing2();
  }

  function calcSpacing2(fromSync) {
    if (!fromSync) setSyncBtnState(false);
    const wall = parseFloat(document.getElementById('sp2-wall').value);
    const count = parseInt(document.getElementById('sp2-count').value) || 0;
    const marginL = parseFloat(document.getElementById('sp2-margin-l').value) || 0;
    const marginR = parseFloat(document.getElementById('sp2-margin-r').value) || 0;

    const arts = [];
    for (let i = 0; i < count; i++) {
      const wEl = document.getElementById(`sp2-art-w-${i}`);
      const hEl = document.getElementById(`sp2-art-h-${i}`);
      if (!wEl) break;
      const w = parseFloat(wEl.value) || 0;
      const h = parseFloat(hEl.value) || 0;
      arts.push({ w, h });
    }

    if (!wall || arts.length === 0 || arts.some(a => a.w === 0)) {
      drawSp2Diagram(null);
      return;
    }

    const totalArtW = arts.reduce((s, a) => s + a.w, 0);
    // 左右の余白を固定して、作品間の間隔を逆算
    const remaining = wall - marginL - marginR - totalArtW;
    const gap = arts.length > 1 ? remaining / (arts.length - 1) : remaining;

    drawSp2Diagram({ wall, arts, gap, marginL, marginR });
  }

  function drawSp2Diagram(data) {
    const W = 380, H = 160;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('sp2-diagram');
    if (!svg) return;
    svg.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    function el(tag, attrs) {
      const e = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      return e;
    }
    function txt(content, attrs) {
      const e = document.createElementNS(ns, 'text');
      Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
      e.textContent = content;
      return e;
    }

    svg.appendChild(el('rect', {x:0,y:0,width:W,height:H,fill:'#f7f4ef'}));
    if (!data) return;

    const { wall, arts, gap, marginL, marginR } = data;
    const totalArtW = arts.reduce((s, a) => s + a.w, 0);
    const totalW = marginL + marginR + totalArtW + gap * (arts.length - 1);

    if (marginL < 0 || marginR < 0 || gap < 0) {
      svg.appendChild(txt('作品が壁に収まりません', {x:W/2,y:H/2,'font-size':12,fill:'#c0392b','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
      return;
    }

    const topMargin = 26;
    const bottomSpace = 30;
    const maxH = H - topMargin - bottomSpace;
    const scale = (W - 40) / wall;

    // 最大高さの作品でスケールを決定
    const maxArtH = Math.max(...arts.map(a => a.h || a.w * 0.8));
    const maxArtHpx = maxArtH * scale;
    const heightLimit = maxArtHpx > maxH ? maxH / maxArtHpx : 1;
    const drawScale = scale * heightLimit;

    // 実際に使う最大高さ（描画後の実サイズ）を再計算し、SVG全体の中央に配置
    const actualMaxArtHpx = maxArtH * drawScale;
    const contentTop = (H - actualMaxArtHpx) / 2;
    const contentBottom = contentTop + actualMaxArtHpx;

    const totalArtWpx = arts.reduce((s,a) => s + a.w * drawScale, 0);
    const totalGapPx = gap * drawScale * (arts.length - 1);
    const marginLPx = marginL * drawScale;
    const marginRPx = marginR * drawScale;
    const totalContentW = marginLPx + marginRPx + totalArtWpx + totalGapPx;
    const wallLeftX = (W - totalContentW) / 2;
    const wallRightX = wallLeftX + totalContentW;

    // 各作品を描画
    let curX = wallLeftX + marginLPx;
    arts.forEach((art, i) => {
      const artWpx = art.w * drawScale;
      const ratio = art.h ? art.h / art.w : 0.8;
      const artHpx = artWpx * ratio;
      // センター揃え（contentTop〜contentBottomの中央に配置）
      const frameY = (contentTop + contentBottom) / 2 - artHpx / 2;

      // 額縁
      svg.appendChild(el('rect', {x:curX+1,y:frameY+1,width:artWpx,height:artHpx,fill:'rgba(0,0,0,0.05)'}));
      svg.appendChild(el('rect', {x:curX,y:frameY,width:artWpx,height:artHpx,fill:'#c8b89a',stroke:'#8c7a5e','stroke-width':1.5}));
      if (artWpx > 10 && artHpx > 10) {
        svg.appendChild(el('rect', {x:curX+4,y:frameY+4,width:artWpx-8,height:artHpx-8,fill:'#f7f4ef'}));
      }

      // 作品番号
      svg.appendChild(txt(`${i+1}`, {x:curX+artWpx/2,y:frameY+artHpx/2+4,'font-size':10,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));

      // 作品幅の寸法線（上）
      const dimY = frameY - 8;
      svg.appendChild(el('line', {x1:curX,y1:dimY,x2:curX+artWpx,y2:dimY,stroke:'#a89070','stroke-width':1,opacity:0.7}));
      svg.appendChild(el('line', {x1:curX,y1:dimY-3,x2:curX,y2:dimY+3,stroke:'#a89070','stroke-width':1,opacity:0.7}));
      svg.appendChild(el('line', {x1:curX+artWpx,y1:dimY-3,x2:curX+artWpx,y2:dimY+3,stroke:'#a89070','stroke-width':1,opacity:0.7}));
      svg.appendChild(txt(Math.round(art.w), {x:curX+artWpx/2,y:dimY-4,'font-size':8,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));

      // 間隔の矢印（作品間）
      if (i < arts.length - 1 && gap > 0) {
        const gapX1 = curX + artWpx;
        const gapX2 = gapX1 + gap * drawScale;
        const arrowY = (contentTop + contentBottom) / 2;
        const gapPx = gap * drawScale;
        svg.appendChild(el('line', {x1:gapX1,y1:arrowY,x2:gapX2,y2:arrowY,stroke:'#8c7a5e','stroke-width':1,'stroke-dasharray':'3,2'}));
        svg.appendChild(el('line', {x1:gapX1,y1:arrowY-4,x2:gapX1,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1}));
        svg.appendChild(el('line', {x1:gapX2,y1:arrowY-4,x2:gapX2,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1}));
        // 間隔が狭く数字が作品と被る場合は、隣接する作品の上部寸法線と同じ高さに表示
        if (gapPx < 24) {
          const nextArt = arts[i + 1];
          const nextArtWpx = nextArt.w * drawScale;
          const nextRatio = nextArt.h ? nextArt.h / nextArt.w : 0.8;
          const nextArtHpx = nextArtWpx * nextRatio;
          const nextFrameY = (contentTop + contentBottom) / 2 - nextArtHpx / 2;
          const higherFrameY = Math.min(frameY, nextFrameY);
          svg.appendChild(txt(Math.round(gap), {x:(gapX1+gapX2)/2,y:higherFrameY-4,'font-size':9,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
        } else {
          svg.appendChild(txt(Math.round(gap), {x:(gapX1+gapX2)/2,y:arrowY-6,'font-size':9,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
        }
      }

      curX += artWpx;
      if (i < arts.length - 1) {
        curX += gap * drawScale;
      }
    });

    // 壁の端
    svg.appendChild(el('line', {x1:wallLeftX,y1:contentTop-6,x2:wallLeftX,y2:contentBottom+20,stroke:'#8c7a5e','stroke-width':2.5}));
    svg.appendChild(el('line', {x1:wallRightX,y1:contentTop-6,x2:wallRightX,y2:contentBottom+20,stroke:'#8c7a5e','stroke-width':2.5}));

    // 余白の矢印（左）
    const arrowY = (contentTop + contentBottom) / 2;
    const firstArtX = wallLeftX + marginLPx;
    svg.appendChild(el('line', {x1:wallLeftX,y1:arrowY,x2:firstArtX,y2:arrowY,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:wallLeftX,y1:arrowY-4,x2:wallLeftX,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:firstArtX,y1:arrowY-4,x2:firstArtX,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(txt(Math.round(marginL), {x:(wallLeftX+firstArtX)/2,y:arrowY-6,'font-size':9,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));

    // 余白の矢印（右）
    const lastArtX2 = curX;
    svg.appendChild(el('line', {x1:lastArtX2,y1:arrowY,x2:wallRightX,y2:arrowY,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:lastArtX2,y1:arrowY-4,x2:lastArtX2,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(el('line', {x1:wallRightX,y1:arrowY-4,x2:wallRightX,y2:arrowY+4,stroke:'#8c7a5e','stroke-width':1.2}));
    svg.appendChild(txt(Math.round(marginR), {x:(lastArtX2+wallRightX)/2,y:arrowY-6,'font-size':9,fill:'#5a4a30','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));

    // 左端の作品〜右端の作品の合計寸法（作品の下）
    const totalDimY = contentBottom + 8;
    const totalSpanMm = totalArtW + gap * (arts.length - 1);
    svg.appendChild(el('line', {x1:firstArtX,y1:totalDimY,x2:lastArtX2,y2:totalDimY,stroke:'#a89070','stroke-width':1,opacity:0.7}));
    svg.appendChild(el('line', {x1:firstArtX,y1:totalDimY-3,x2:firstArtX,y2:totalDimY+3,stroke:'#a89070','stroke-width':1,opacity:0.7}));
    svg.appendChild(el('line', {x1:lastArtX2,y1:totalDimY-3,x2:lastArtX2,y2:totalDimY+3,stroke:'#a89070','stroke-width':1,opacity:0.7}));
    svg.appendChild(txt(Math.round(totalSpanMm), {x:(firstArtX+lastArtX2)/2,y:totalDimY+11,'font-size':9,fill:'#8c7a5e','font-family':'-apple-system,Hiragino Sans,sans-serif','text-anchor':'middle'}));
  }

  // 初期描画
  window.addEventListener('resize', () => { drawTicks(); });
  function initApp() {
    drawTicks();
    const icon = document.getElementById('sp2-margin-lock-icon');
    const btn = document.getElementById('sp2-margin-lock');
    if (icon && btn) {
      btn.style.background = '#8c7a5e';
      btn.style.borderColor = '#8c7a5e';
      btn.style.color = '#f7f4ef';
      icon.innerHTML = `
        <rect x="1" y="7" width="12" height="8" rx="2" fill="#f7f4ef"/>
        <path d="M4 7V5a3 3 0 016 0v2" stroke="#f7f4ef" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="7" cy="11" r="1.2" fill="#8c7a5e"/>`;
    }
    drawLockIcon();
    drawDiagram();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(initApp));
  } else {
    requestAnimationFrame(initApp);
  }
</script>
</body>
